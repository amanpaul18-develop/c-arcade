<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>C Arcade: Switch, If-Else, Loops</title>
<style>
:root{--bg:#f6f4fb;--card:#fff;--tx:#1d1b26;--mu:#6b6880;--code:#14121f;--ct:#d9d6ea;--hl:#ffd23f;--hlt:#14121f;--r:#e21b3c;--b:#1368ce;--y:#d89e00;--g:#26890c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17141f;--card:#221e2e;--tx:#f1eefb;--mu:#a29db8;--code:#0d0b14}}
*{box-sizing:border-box}html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,sans-serif;padding:14px}
h1{font-size:22px;margin:4px 0 2px}p.s{color:var(--mu);margin:0 0 12px;font-size:14px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:10px 4px;border:0;border-radius:10px;background:var(--card);color:var(--tx);font-weight:700;font-size:12px}
.tabs button.on{background:var(--b);color:#fff}
.card{background:var(--card);border-radius:14px;padding:14px;max-width:560px;margin:0 auto}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.opts button{border:0;border-radius:10px;padding:16px 6px;color:#fff;font-weight:800;font-size:15px}
.o1{background:var(--r)}.o2{background:var(--b)}.o3{background:var(--y)}.o4{background:var(--g)}
pre{background:var(--code);color:var(--ct);border-radius:10px;padding:10px 0;margin:10px 0;font-size:12.5px;line-height:1.55;overflow-x:auto}
pre span{display:block;padding:0 12px;white-space:pre}
pre span.a{background:var(--hl);color:var(--hlt);font-weight:700}
pre span.d{opacity:.4;text-decoration:line-through}
.out{background:var(--code);color:#7CFC9A;border-radius:10px;padding:10px 12px;font-family:ui-monospace,monospace;min-height:44px;white-space:pre;font-size:14px}
.lab{font-size:12px;color:var(--mu);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-top:8px}
.row{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:14px}
input[type=range]{flex:1}
.btn{border:0;border-radius:10px;padding:12px 16px;background:var(--b);color:#fff;font-weight:700;font-size:14px}
.btn.g{background:var(--g)}.btn.r{background:var(--r)}
.chip{display:inline-block;background:var(--code);color:var(--hl);border-radius:8px;padding:4px 10px;font-family:ui-monospace,monospace;font-size:13px;margin-right:6px}
.note{font-size:13px;color:var(--mu);margin:8px 0 0}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:260px;margin:10px auto}
.board button{aspect-ratio:1;border:0;border-radius:10px;background:var(--code);color:#fff;font-size:34px;font-weight:800}
.board button.w{background:var(--g)}
</style></head><body>
<h1>C Arcade 🎮</h1>
<p class="s">Tap, toggle and watch the code run, line by line.</p>
<div class="tabs"><button class="on" data-t="sw">switch</button><button data-t="ie">if-else</button><button data-t="lp">for</button><button data-t="tt">tic-tac-toe</button></div>
<div class="card" id="sw"></div><div class="card" id="ie" hidden></div><div class="card" id="lp" hidden></div><div class="card" id="tt" hidden></div>
<script>
function code(el,lines,act,dim){el.innerHTML=lines.map((l,i)=>'<span class="'+(act.has(i)?'a':'')+(dim&&dim.has(i)?' d':'')+'">'+l.replace(/</g,'&lt;')+'</span>').join('')}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');['sw','ie','lp','tt'].forEach(i=>document.getElementById(i).hidden=i!==b.dataset.t)});

/* SWITCH */
(function(){const root=document.getElementById('sw');
root.innerHTML='<b>☕ Vending machine</b><div class="opts"><button class="o1" data-c="1">1 · Coffee</button><button class="o2" data-c="2">2 · Tea</button><button class="o3" data-c="3">3 · Juice</button><button class="o4" data-c="4">4 · Mystery</button></div><label class="row"><input type="checkbox" id="brk" checked> Keep <b>break</b> statements</label><pre id="swc"></pre><div class="lab">Output</div><div class="out" id="swo">Press a button…</div><p class="note">Turn break off and press 1: watch the code fall through into the next cases.</p>';
const L=['switch (choice) {','  case 1: printf("Coffee\\n");','    break;','  case 2: printf("Tea\\n");','    break;','  case 3: printf("Juice\\n");','    break;','  default: printf("Invalid\\n");','}'];
const P={1:'Coffee',2:'Tea',3:'Juice'},st={1:1,2:3,3:5};let last=null;
function run(c){last=c;const brk=document.getElementById('brk').checked,act=new Set([0,8]);let out='';let i=st[c]!==undefined?st[c]:7;
for(;i<8;i++){act.add(i);if(L[i].includes('printf'))out+=(L[i].match(/"(.*?)\\n"/)[1])+'\n';if(L[i].includes('break')&&brk)break}
code(document.getElementById('swc'),L,act,brk?null:new Set([2,4,6]));document.getElementById('swo').textContent=out}
root.querySelectorAll('.opts button').forEach(b=>b.onclick=()=>run(+b.dataset.c));
document.getElementById('brk').onchange=()=>last&&run(last);code(document.getElementById('swc'),L,new Set())})();

/* IF-ELSE */
(function(){const root=document.getElementById('ie');
root.innerHTML='<b>🎟️ Club bouncer</b><div class="row">Age <input type="range" id="age" min="10" max="30" value="20"><span class="chip" id="av">20</span></div><label class="row"><input type="checkbox" id="tk" checked> hasTicket = 1</label><pre id="iec"></pre><div class="lab">Output</div><div class="out" id="ieo"></div><p class="note">The outer condition is checked first. The inner one only runs if the outer is true.</p>';
const L=['if (age >= 18) {','  if (hasTicket) {','    printf("Welcome in!");','  } else {','    printf("Buy a ticket");','  }','} else {','  printf("Too young");','}'];
function run(){const a=+document.getElementById('age').value,t=document.getElementById('tk').checked;document.getElementById('av').textContent=a;
let act,o;if(a>=18){if(t){act=[0,1,2];o='Welcome in! 🎉'}else{act=[0,1,4];o='Buy a ticket 🎫'}}else{act=[0,7];o='Too young 🚫'}
code(document.getElementById('iec'),L,new Set(act));document.getElementById('ieo').textContent=o}
document.getElementById('age').oninput=run;document.getElementById('tk').onchange=run;run()})();

/* NESTED FOR */
(function(){const root=document.getElementById('lp');
root.innerHTML='<b>⭐ Star triangle</b><div class="row">rows <input type="range" id="rw" min="2" max="7" value="4"><span class="chip" id="rv">4</span></div><pre id="lpc"></pre><div><span class="chip" id="vi">i = –</span><span class="chip" id="vj">j = –</span></div><div class="lab">Output</div><div class="out" id="lpo"></div><div class="row"><button class="btn" id="stp">Step ▶</button><button class="btn g" id="all">Run all</button><button class="btn r" id="rst">Reset</button></div><p class="note">The inner loop finishes completely for every single turn of the outer loop.</p>';
const L=['for (i = 1; i <= rows; i++) {','  for (j = 1; j <= i; j++) {','    printf("*");','  }','  printf("\\n");','}'];
let n=4,k=0,steps=[];
function build(){n=+document.getElementById('rw').value;document.getElementById('rv').textContent=n;steps=[];for(let i=1;i<=n;i++){for(let j=1;j<=i;j++)steps.push({i,j,t:'*',l:2});steps.push({i,j:i+1,t:'\n',l:4})}k=0;draw()}
function draw(){let o='',a=new Set();for(let s=0;s<k;s++)o+=steps[s].t;
if(k){const s=steps[k-1];a=new Set([s.l===2?1:0,s.l]);document.getElementById('vi').textContent='i = '+s.i;document.getElementById('vj').textContent='j = '+(s.l===2?s.j:'–')}else{document.getElementById('vi').textContent='i = –';document.getElementById('vj').textContent='j = –'}
code(document.getElementById('lpc'),L,a);document.getElementById('lpo').textContent=o}
document.getElementById('rw').oninput=build;
document.getElementById('stp').onclick=()=>{if(k<steps.length){k++;draw()}};
document.getElementById('all').onclick=()=>{k=steps.length;draw()};
document.getElementById('rst').onclick=()=>{k=0;draw()};build()})();

/* TIC-TAC-TOE */
(function(){const root=document.getElementById('tt');
root.innerHTML='<b>❌⭕ Tic-tac-toe</b><p class="note" id="tts"></p><div class="board" id="bd"></div><div class="row"><button class="btn r" id="ttr">New game</button></div><div class="lab">Board drawn with nested for</div><pre id="tc1"></pre><div class="lab">Win check (if-else ladder)</div><pre id="tc2"></pre>';
code(document.getElementById('tc1'),['for (i = 0; i < 3; i++) {','  for (j = 0; j < 3; j++) {','    printf(" %c ", board[i][j]);','  }','  printf("\\n");','}'],new Set([1,2]));
const L2=['if (row 1 all same) winner;','else if (row 2 all same) winner;','else if (row 3 all same) winner;','else if (any column all same) winner;','else if (any diagonal all same) winner;','else if (board is full) draw;'];
const W=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const bd=document.getElementById('bd'),cells=[];let b,over,win=[];
for(let i=0;i<3;i++){for(let j=0;j<3;j++){const c=document.createElement('button');c.onclick=()=>play(i*3+j);bd.appendChild(c);cells.push(c)}}
function res(){for(let w=0;w<8;w++){const[a,c,d]=W[w];if(b[a]&&b[a]===b[c]&&b[c]===b[d])return{w:b[a],l:w<3?w:w<6?3:4,cells:W[w]}}if(b.every(x=>x))return{w:'D',l:5,cells:[]};return null}
function draw(r){cells.forEach((c,i)=>{c.textContent=b[i];c.style.color=b[i]==='X'?'#ff5a74':'#ffd23f';c.className=win.includes(i)?'w':'';c.disabled=over||!!b[i]});
if(r){document.getElementById('tts').textContent=r.w==='X'?'You win! 🎉':r.w==='O'?'Computer wins 🤖':'It is a draw 🤝';code(document.getElementById('tc2'),L2,new Set([r.l]))}else{document.getElementById('tts').textContent='Your turn: you are X.';code(document.getElementById('tc2'),L2,new Set())}}
function ai(){let m=-1;for(const p of['O','X']){for(let i=0;i<9&&m<0;i++){if(!b[i]){b[i]=p;const ok=W.some(([a,c,d])=>b[a]&&b[a]===b[c]&&b[c]===b[d]);b[i]='';if(ok)m=i}}}
if(m<0){if(!b[4])m=4;else{const e=b.map((v,i)=>v?-1:i).filter(i=>i>=0);m=e[Math.floor(Math.random()*e.length)]}}b[m]='O'}
function play(i){if(over||b[i])return;b[i]='X';let r=res();if(!r){ai();r=res()}if(r){over=true;win=r.cells}draw(r)}
function reset(){b=Array(9).fill('');over=false;win=[];draw(null)}
document.getElementById('ttr').onclick=reset;reset()})();
</script></body></html>
